name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Ensure Electron runtime
        run: node node_modules/electron/install.js
      - name: Build and package
        run: npm run package
        env:
          # Configure these repository secrets to produce signed installers:
          #   CSC_LINK              base64-encoded .pfx or a path to it
          #   CSC_KEY_PASSWORD      password for the certificate
          # electron-builder signs automatically when both are present.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          npm run sbom
          sha256sum dist/*.exe dist/sbom.cdx.json > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.exe \
              dist/sbom.cdx.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.exe \
              dist/sbom.cdx.json \
              dist/SHA256SUMS.txt \
              --generate-notes \
              --title "DevForge ${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
