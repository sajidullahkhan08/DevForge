name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generate SBOM
        run: npm run sbom
      - name: Build and package
        run: npm run package
        env:
          # Configure these repository secrets to produce signed installers:
          #   CSC_LINK              base64-encoded .pfx or a path to it
          #   CSC_KEY_PASSWORD      password for the certificate
          # electron-builder signs automatically when both are present.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.exe \
            dist/sbom.cdx.json \
            --generate-notes \
            --title "DevForge ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
